name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  secrets-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Redacted secret scan
        run: npm run security:secrets
      - name: Dependency audit
        run: npm audit --audit-level=high

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Shared package builds
        run: npm run build -w @attruvi/core && npm run build -w @attruvi/connectors
      - name: Web production build
        run: npm run build
      - name: React Native SDK build
        run: npm run build -w @attruvi/react-native
      - name: Links Worker build
        run: npm run build -w @attruvi/worker-links
      - name: Ingest Worker build
        run: npm run build -w @attruvi/worker-ingest
